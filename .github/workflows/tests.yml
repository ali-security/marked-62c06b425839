name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional jasmine --filter expression; empty runs the full suite"
        required: false
        default: ""

jobs:
  Test:
    strategy:
      fail-fast: false
      matrix:
        node_version: [14, 16]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Pin the registry to the release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2021-05-27T16:17:12.429000Z
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm test -- test/unit/**/*-spec.js --filter="${{ inputs.test-filter }}"
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm test -- test/specs/**/*-spec.js --filter="${{ inputs.test-filter }}"
          else
            npm run test:specs
          fi
      - name: Install the npm that packed the published tarball
        if: matrix.node_version == 14
        run: npm i -g npm@7.12.0
      - name: Pack 🗜️
        if: matrix.node_version == 14
        run: npm pack
      - name: Upload Package Tarball 📦
        if: matrix.node_version == 14
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-*.tgz
          if-no-files-found: error
